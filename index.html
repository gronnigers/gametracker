<div class="sheet" id="sheet"><div class="shead"><button class="bk" onclick="closeList()">&lsaquo;</button><h2 id="stitle"></h2></div><div class="list" id="list"></div></div>

<script>
const WORKER="https://gametrack-igdb.gronniger.workers.dev";
const IMG=id=>id?`https://images.igdb.com/igdb/image/upload/t_cover_small/${id}.jpg`:"";
async function openList(ids,name){
  const s=document.getElementById("sheet");s.classList.add("on");
  document.getElementById("stitle").textContent=name+" · Top 100";
  document.getElementById("list").innerHTML='<div class="msg">Loading top games…</div>';
  try{
    const r=await fetch(WORKER,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({endpoint:"games",query:`fields name,cover.image_id,total_rating,first_release_date; where platforms=(${ids}) & cover!=null & game_type=(0,8,9,10,11) & total_rating_count>3; sort total_rating_count desc; limit 100;`})});
    const g=await r.json();
    if(!Array.isArray(g)||!g.length){document.getElementById("list").innerHTML='<div class="msg">No games found.</div>';return;}
    document.getElementById("list").innerHTML=g.map((x,i)=>`<div class="lrow"><span class="rank">${i+1}</span><img loading="lazy" src="${IMG(x.cover&&x.cover.image_id)}" onerror="this.style.opacity=0"><div class="li"><div class="ln">${(x.name||'').replace(/</g,'&lt;')}</div><div class="lm">${x.total_rating?'★ '+Math.round(x.total_rating):''}${x.first_release_date?' · '+new Date(x.first_release_date*1000).getFullYear():''}</div></div><button class="pl" onclick="event.stopPropagation()">+</button></div>`).join("");
  }catch(e){document.getElementById("list").innerHTML='<div class="msg">Can\'t load in this preview (network blocked). Works live in the app.</div>';}
}
function closeList(){document.getElementById("sheet").classList.remove("on");}
</script></body></html>
